<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Совет молодых специалистов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Pangolin&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: comic book. Navy header strip with speed lines, halftone paper, panels with thick ink outlines and hard offset shadows; right-side drawer as a big panel */
:root{
  --bg:#E6EFFF; --dot:rgba(31,91,255,.16); --speed:rgba(10,22,51,.05);
  --surface:#FFFFFF; --surface-2:#DDE8FF; --ink:#0A1633; --muted:#44557E; --line:#0A1633; --hair:#B9CAEE;
  --accent:#1F5BFF; --accent-soft:#D3E1FF; --on-accent:#FFFFFF; --pop:#FFD23F; --on-pop:#0A1633; --pink:#FF4F8B;
  --nav:#0A1C47; --nav-2:#1A3478; --on-nav:#FFFFFF; --on-nav-muted:#AFC3EC; --hard:#0A1633;
  --sun:#FFD23F; --on-sun:#0A1633;
  --good:#12875A; --warn:#B86E00; --bad:#D32F4C; --good-soft:#D6F3E6; --warn-soft:#FFF0CC; --bad-soft:#FFDCE3;
  --d-edu:#1F5BFF; --d-sport:#F06A0F; --d-culture:#D6329A; --d-social:#0E968E;
  --f-display:"Pangolin","Comic Sans MS","Segoe Print","Chalkboard SE","Nunito",cursive;
  --f-sfx:"Rubik Mono One","Impact","Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Rubik Mono One","Nunito",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071230; --dot:rgba(111,160,255,.13); --speed:rgba(255,255,255,.035);
  --surface:#0F2152; --surface-2:#18306C; --ink:#EEF3FF; --muted:#A8BBE3; --line:#DCE6FF; --hair:#2D4A8C;
  --accent:#6A9BFF; --accent-soft:#1E3C85; --on-accent:#061230; --pop:#FFD84F; --on-pop:#0A1633; --pink:#FF6FA0;
  --nav:#030B22; --nav-2:#16316E; --on-nav:#FFFFFF; --on-nav-muted:#8FA6D6; --hard:#000000;
  --sun:#FFD84F; --on-sun:#0A1633;
  --good:#44D19A; --warn:#F5B547; --bad:#FF7089; --good-soft:#123D30; --warn-soft:#3F3013; --bad-soft:#44192A;
  --d-edu:#6A9BFF; --d-sport:#FF944D; --d-culture:#F06CC6; --d-social:#3CC7BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071230; --dot:rgba(111,160,255,.13); --speed:rgba(255,255,255,.035);
  --surface:#0F2152; --surface-2:#18306C; --ink:#EEF3FF; --muted:#A8BBE3; --line:#DCE6FF; --hair:#2D4A8C;
  --accent:#6A9BFF; --accent-soft:#1E3C85; --on-accent:#061230; --pop:#FFD84F; --on-pop:#0A1633; --pink:#FF6FA0;
  --nav:#030B22; --nav-2:#16316E; --on-nav:#FFFFFF; --on-nav-muted:#8FA6D6; --hard:#000000;
  --sun:#FFD84F; --on-sun:#0A1633;
  --good:#44D19A; --warn:#F5B547; --bad:#FF7089; --good-soft:#123D30; --warn-soft:#3F3013; --bad-soft:#44192A;
  --d-edu:#6A9BFF; --d-sport:#FF944D; --d-culture:#F06CC6; --d-social:#3CC7BD; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:repeating-conic-gradient(from 0deg at 105% -5%,var(--speed) 0 1.2deg,transparent 1.2deg 5deg),radial-gradient(var(--dot) 1.3px,transparent 1.5px);
  background-size:100% 100%,13px 13px;background-attachment:fixed;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.1} h2{font-size:1.4rem;line-height:1.15} h3{font-size:1.15rem}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-body);font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* шапка: тёмно-синяя полоса с линиями скорости */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:var(--on-nav);border-bottom:3px solid var(--hard);
  background:repeating-linear-gradient(-60deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px),var(--nav)}
.bar-in{max-width:1240px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:46px;height:46px;border-radius:10px;background:var(--pop);color:var(--on-pop);display:grid;place-items:center;font-family:var(--f-sfx);font-size:.72rem;transform:rotate(-6deg);flex:none;border:3px solid var(--hard);box-shadow:3px 3px 0 var(--accent)}
.brand-t{font-family:var(--f-display);font-size:1.05rem;line-height:1.05}
.brand-s{font-size:.72rem;color:var(--on-nav-muted);font-weight:700;letter-spacing:.04em}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:4px}
.tab{border:2px solid transparent;background:none;padding:7px 14px;border-radius:12px;font-weight:800;color:var(--on-nav-muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--on-nav);border-color:var(--nav-2)}
.tab[aria-current="true"]{background:var(--accent);color:#fff;border-color:#fff;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--hard)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;border:2px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:.8rem;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.bar .seg{background:var(--nav-2);border-color:var(--on-nav-muted)}
.bar .seg button{color:var(--on-nav-muted)}
.bar .seg button[aria-pressed="true"]{background:var(--on-nav);color:var(--nav)}

main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 72px;display:grid;gap:24px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.head h1{display:inline-block;background:var(--surface);border:3px solid var(--line);padding:6px 16px 8px;border-radius:6px;box-shadow:5px 5px 0 var(--hard);transform:rotate(-1deg);margin-top:6px}

/* панели-кадры */
.panel{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:18px;min-width:0;box-shadow:6px 6px 0 var(--hard)}
.panel > h2,.panel-h{margin-bottom:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.kpi{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:4px 4px 0 var(--hard);position:relative}
.kpi b{display:block;font-family:var(--f-sfx);font-size:1.7rem;line-height:1.1;margin-top:6px;font-weight:400}
.kpi:nth-child(odd){transform:rotate(-.6deg)} .kpi:nth-child(even){transform:rotate(.6deg)}
.kpi.hot{background:var(--pop);color:var(--on-pop)}
.kpi.hot .eyebrow{color:var(--on-pop);opacity:.8}
.kpi:first-child{background:var(--nav);color:var(--on-nav)}
.kpi:first-child .eyebrow{color:var(--on-nav-muted)}
.sfx{position:absolute;top:-14px;right:-8px;font-family:var(--f-sfx);font-size:.7rem;background:var(--pink);color:#fff;padding:4px 8px;border:2px solid var(--hard);transform:rotate(8deg);border-radius:4px}

.btn{border:2.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:3px 3px 0 var(--hard);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ai{background:var(--nav);color:var(--on-nav)}
.btn.ai::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pop);border:1.5px solid var(--hard)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--surface-2);color:var(--ink);white-space:nowrap;border:1.5px solid var(--hair)}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--hard)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:currentColor} .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:currentColor} .chip.bad{background:var(--bad-soft);color:var(--bad);border-color:currentColor}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:currentColor}
.chip.demo{background:var(--pop);color:var(--on-pop);border-color:var(--hard)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--hard)}

.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem;flex:none;font-family:var(--f-display);border:2.5px solid var(--hard)}
.av.lg{width:68px;height:68px;font-size:1.3rem;border-width:3px}
.av.xl{width:104px;height:104px;font-size:1.8rem;border-width:3px}
.av.sm{width:28px;height:28px;font-size:.7rem;border-width:2px}
img.av{object-fit:cover;background:var(--surface-2)}
.phwrap{position:relative;flex:none}
.phbtn{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--pop);color:var(--on-pop);display:grid;place-items:center;cursor:pointer;border:2px solid var(--hard)}
.phbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.str{display:flex;gap:6px;flex-wrap:wrap}
.str .chip{background:var(--good-soft);color:var(--good);border-color:currentColor}
.lvl{display:inline-flex;gap:2px}.lvl i{width:4px;height:9px;border-radius:2px;background:currentColor;opacity:.25}.lvl i.on{opacity:1}
.comp{display:grid;grid-template-columns:minmax(0,190px) 1fr 30px;gap:10px;align-items:center;font-size:.9rem}
.chairbox{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:12px;background:var(--nav-2);color:var(--on-nav);cursor:pointer;border:2px solid var(--on-nav-muted)}
.chairbox .t{font-size:.7rem;color:var(--on-nav-muted);line-height:1.1;font-weight:700}.chairbox .n{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.chaircard{display:flex;gap:20px;align-items:center;color:var(--on-nav);border:3px solid var(--line);border-radius:6px;padding:20px 22px;cursor:pointer;text-align:left;width:100%;flex-wrap:wrap;box-shadow:7px 7px 0 var(--hard);position:relative;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 12% 50%,rgba(255,255,255,.07) 0 3deg,transparent 3deg 12deg),linear-gradient(120deg,var(--nav),var(--nav-2))}
.chaircard .eyebrow{color:var(--pop)}
.chaircard h2{font-size:1.8rem}
.chaircard .quote{position:relative;background:#fff;color:#0A1633;border:2.5px solid #0A1633;border-radius:16px;padding:8px 14px;font-family:var(--f-display);font-size:1rem;max-width:320px}
.chaircard .quote::before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right:12px solid #0A1633}

/* карточки участников */
.mcard{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;width:100%;box-shadow:5px 5px 0 var(--hard);transition:transform .12s}
.mcard:hover{transform:rotate(-1deg) translateY(-2px);box-shadow:7px 7px 0 var(--accent)}
.mcard-top{display:flex;gap:12px;align-items:center;min-width:0}
.mcard-top > div{min-width:0}
.mcard-name{font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.score{margin-left:auto;text-align:center;flex:none;background:var(--pop);color:var(--on-pop);border:2.5px solid var(--hard);border-radius:50%;width:54px;height:54px;display:grid;place-content:center;transform:rotate(8deg)}
.score b{font-family:var(--f-sfx);font-size:1rem;line-height:1;font-weight:400}
.score .small{font-size:.65rem;font-weight:800;color:var(--on-pop)}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1.5px solid var(--line)}
.meter i{display:block;height:100%}
.loadrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.85rem}

.lrow{display:grid;grid-template-columns:minmax(0,170px) 1fr 52px;gap:12px;align-items:center;padding:7px 0;border-bottom:2px dotted var(--hair);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow .nm{display:flex;gap:8px;align-items:center;min-width:0;font-weight:700}
.lrow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar{position:relative;height:14px;border-radius:4px;background:var(--surface-2);border:2px solid var(--line)}
.lbar i{position:absolute;inset:0 auto 0 0}
.lbar .cap{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--pink)}

.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--surface-2);min-width:0;border:2px solid var(--line)}
.item > div{min-width:0}
.item-t{font-weight:800}
.stripe{width:6px;align-self:stretch;border-radius:3px;flex:none;border:1.5px solid var(--hard)}
.empty{padding:22px;border:3px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center;font-family:var(--f-display);font-size:1.1rem;background:var(--surface)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 8px;text-align:left;border-bottom:2px dotted var(--hair);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;cursor:pointer;white-space:nowrap;border-bottom:3px solid var(--line)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--surface-2)}
.rank{font-family:var(--f-sfx);font-size:1rem;width:44px}
.rank.top{color:var(--accent)}
.cell-bar{display:grid;gap:4px;min-width:84px}
.cell-bar .meter{height:8px}
.total{font-family:var(--f-sfx);font-size:1.1rem}
.weights{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.wt label{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
.wt input{width:100%;accent-color:var(--accent)}
.wt p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}

.ecard{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:14px 16px 14px 20px;display:grid;gap:8px;cursor:pointer;min-width:0;position:relative;overflow:hidden;box-shadow:5px 5px 0 var(--hard)}
.ecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--dc);border-right:2.5px solid var(--line)}
.ecard:hover{transform:rotate(.6deg)}
.ecard.ro{cursor:default}
.ecard.ro:hover{transform:none}
.ecard-t{font-family:var(--f-display);font-size:1.2rem;line-height:1.15}
.progress{font-size:.8rem;color:var(--muted);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}

.field{display:grid;gap:5px}
.field > span{font-size:.8rem;font-weight:800;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:2.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:74px;resize:vertical}
.form{display:grid;gap:14px}
.form2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.skills{display:grid;gap:6px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0;border-bottom:2px dotted var(--hair)}
.dots{display:flex;gap:4px}
.dots button{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:800;cursor:pointer;color:var(--muted)}
.dots button.on{background:var(--accent);color:var(--on-accent)}
.tenrow{display:flex;gap:4px;flex-wrap:wrap}
.tenrow button{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:.82rem}
.tenrow button.on{background:var(--nav);color:var(--on-nav);box-shadow:2px 2px 0 var(--accent)}
.tenrow button.in{background:var(--accent-soft)}

.overlay{position:fixed;inset:0;background:rgba(5,12,35,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:13px 13px;width:min(760px,100%);height:100%;overflow-y:auto;padding:0 0 60px;border-left:4px solid var(--hard)}
.dhead{position:sticky;top:0;z-index:2;background:var(--nav);color:var(--on-nav);border-bottom:3px solid var(--hard);padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center}
.dhead > div{min-width:0}
.dhead .muted{color:var(--on-nav-muted)}
.dhead .btn.ghost{color:var(--on-nav)}
.dbody{padding:20px;display:grid;gap:18px}
.sect{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:5px 5px 0 var(--hard)}
.sect-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bul{margin:0;padding-left:18px;display:grid;gap:4px}
.cols2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.idea{border:3px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:8px;background:var(--surface);box-shadow:4px 4px 0 var(--hard)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,150px) 140px auto;gap:8px;align-items:center}
.taskro{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dotted var(--hair)}
.taskro:last-child{border-bottom:0}
.taskro.done .tt{text-decoration:line-through;color:var(--muted)}
.think{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;font-family:var(--f-display)}
.think i{width:16px;height:16px;border-radius:50%;border:3px solid var(--accent);border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* речевой пузырь */
.bubble,.banner{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:12px 18px;font-size:.95rem;box-shadow:4px 4px 0 var(--hard)}
.bubble{font-family:var(--f-display);font-size:1.12rem}
.bubble::after,.banner::after{content:"";position:absolute;left:34px;bottom:-17px;width:22px;height:17px;background:var(--line);clip-path:polygon(0 0,100% 0,15% 100%)}
.bubble::before,.banner::before{content:"";position:absolute;left:37px;bottom:-11px;width:16px;height:13px;background:var(--surface);clip-path:polygon(0 0,100% 0,15% 100%);z-index:1}
.banner{background:var(--pop);color:var(--on-pop)} .banner::before{background:var(--pop)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1.5deg);background:var(--pop);color:var(--on-pop);padding:10px 18px;border-radius:10px;font-family:var(--f-display);font-size:1.1rem;z-index:80;max-width:calc(100% - 32px);border:3px solid var(--hard);box-shadow:4px 4px 0 var(--hard)}
.bars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,150px) 1fr 34px;gap:10px;align-items:center;font-size:.88rem;font-weight:700}
.hb .track{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex;border:2px solid var(--line)}
.hb .track i{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* мем-стена */
.memes{columns:3 280px;column-gap:22px}
.meme{break-inside:avoid;margin-bottom:22px;background:var(--surface);border:3px solid var(--line);border-radius:6px;box-shadow:6px 6px 0 var(--hard);overflow:hidden;display:grid}
.meme:nth-child(3n+1){transform:rotate(-.8deg)} .meme:nth-child(3n+2){transform:rotate(.7deg)}
.meme-pic{position:relative;background:#0A1633;display:grid;min-height:140px}
.meme-pic img{width:100%;display:block}
.mtext{position:absolute;left:8px;right:8px;text-align:center;font-family:var(--f-sfx);font-size:clamp(.85rem,2.4vw,1.05rem);line-height:1.15;color:#fff;text-transform:uppercase;
  text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 2px 0 #000,2px 0 0 #000,0 -2px 0 #000,-2px 0 0 #000}
.mtext.t{top:8px}.mtext.b{bottom:8px}
.meme-drawn{padding:0;display:grid}
.meme-drawn .p{padding:14px 16px;border-bottom:3px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;font-family:var(--f-display);font-size:1.05rem;line-height:1.25}
.meme-drawn .p:last-child{border-bottom:0}
.meme-drawn .p .lab{font-family:var(--f-sfx);font-size:.62rem;background:var(--nav);color:var(--on-nav);padding:3px 6px;border-radius:3px;grid-column:1/-1;justify-self:start}
.meme-drawn svg{width:64px;height:64px;flex:none}
.meme-f{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:3px solid var(--line)}
.lol{border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-weight:800;cursor:pointer;font-size:.82rem}
.lol[aria-pressed="true"]{background:var(--pop);color:var(--on-pop)}
@media (prefers-reduced-motion:reduce){.think i{animation:none}*{transition:none!important}}
@media (max-width:640px){
  .chairbox .txt{display:none}
  .bar-in{padding-inline:16px;gap:10px;padding-block:8px}
  main{padding-inline:16px}
  .tabs{order:3;flex-basis:100%}
  .task{grid-template-columns:auto minmax(0,1fr);}
  .task > :nth-child(n+3){grid-column:2}
  .lrow{grid-template-columns:minmax(0,110px) 1fr 44px}
  .dbody{padding:14px 16px}
  h1{font-size:1.6rem}
  .kpi,.meme{transform:none!important}
}

<script>
/* Автономный режим: данные хранятся в этом браузере (localStorage) и в самом файле */
(function(){
  if(window.claude) return;
  const KEY="sms-council-data-v1";
  const seedEl=document.getElementById("seed");
  let seed={}; try{seed=JSON.parse(seedEl.textContent)}catch(e){}
  let data=null; try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!data||((data.__meta||{}).ts||0)<((seed.__meta||{}).ts||0)) data=JSON.parse(JSON.stringify(seed));
  const subs=[];
  let warned=false;
  function persist(){
    data.__meta={ts:Date.now()};
    try{localStorage.setItem(KEY,JSON.stringify(data))}
    catch(e){if(!warned){warned=true;setTimeout(()=>window.toast&&toast("Память браузера заполнена. Нажми «Сохранить файл с данными», чтобы ничего не потерять"),50)}}
  }
  const coll=c=>data[c]||(data[c]={});
  const snapDoc=(c,id)=>{const d=coll(c)[id];return {id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}};
  const snapColl=c=>{const o=coll(c);const docs=Object.keys(o).sort().map(id=>snapDoc(c,id));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
  function notify(c){subs.forEach(s=>{if(s.c===c)setTimeout(()=>s.fn(s.id?snapDoc(c,s.id):snapColl(c)),0)})}
  function sub(c,id,fn){const s={c,id,fn};subs.push(s);setTimeout(()=>fn(id?snapDoc(c,id):snapColl(c)),0);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  function docRef(path){
    const a=path.split("/"),id=a.pop(),c=a.join("/");
    return {id,path,
      get:async()=>snapDoc(c,id),
      set:async d=>{coll(c)[id]=JSON.parse(JSON.stringify(d));persist();notify(c)},
      update:async d=>{const cur=coll(c)[id];if(!cur)throw {code:"invalid_argument",message:"no doc"};coll(c)[id]={...cur,...JSON.parse(JSON.stringify(d))};persist();notify(c)},
      delete:async()=>{delete coll(c)[id];persist();notify(c)},
      onSnapshot:(fn)=>sub(c,id,fn),
      collection:p=>collRef(path+"/"+p)};
  }
  function collRef(c){
    return {path:c,doc:id=>docRef(c+"/"+(id||("x"+Math.random().toString(36).slice(2,10)))),
      add:async d=>{const r=docRef(c+"/x"+Math.random().toString(36).slice(2,10));await r.set(d);return r},
      get:async()=>snapColl(c),onSnapshot:fn=>sub(c,null,fn),
      where(){return this},orderBy(){return this},limit(){return this}};
  }
  const toDataUrl=blob=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(blob)});
  const caps={
    db:{doc:docRef,collection:collRef},
    user:{isOwner:async()=>true,canEdit:async()=>true,can:async()=>true,id:async()=>"local",
      me:async()=>({id:"local",name:"",email:null,isOwner:true,canEdit:true,avatarUrl:"",color:"#1F5BFF"}),profiles:async ids=>({})},
    assets:{upload:async blob=>{const url=await toDataUrl(blob);return {id:url,url,sizeBytes:blob.size,contentType:blob.type}}}
  };
  window.claude={use:async n=>caps[n]||null};

  /* резервные копии */
  function download(name,text,type){
    const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  }
  const stamp=()=>new Date().toISOString().slice(0,10);
  window.__local={
    saveHtml(){
      const root=document.documentElement.cloneNode(true);
      root.removeAttribute("data-theme");
      const q=s=>root.querySelector(s);
      q("#tabs").innerHTML="";q("#modeSw").innerHTML="";q("#chairBox").innerHTML="";q("#modal").innerHTML="";
      q("#main").innerHTML='<div class="panel empty" id="boot">Загружаю совет… Пока можно налить чай.</div>';
      const t=q("#toast");t.hidden=true;t.textContent="";
      data.__meta={ts:Date.now()};
      q("#seed").textContent=JSON.stringify(data).replace(/</g,"\\u003c");
      download("Совет-молодых-специалистов-"+stamp()+".html","<!DOCTYPE html>\n"+root.outerHTML,"text/html");
    },
    exportJson(){download("smc-data-"+stamp()+".json",JSON.stringify(data,null,1),"application/json")},
    async importJson(file){
      const next=JSON.parse(await file.text());
      if(!next||typeof next!=="object"||!next.members) throw new Error("bad");
      const names=new Set([...Object.keys(data),...Object.keys(next)]);
      data=next;persist();names.forEach(n=>{if(n!=="__meta")notify(n)});
    }
  };
})();
</script>

  members:[],events:[],ideas:[],memes:[],memeDraft:{top:"",bottom:"",img:null},jokeI:Math.floor(Math.random()*100),chair:{},settings:null,surveys:[],mySurvey:undefined,

/* ============ утилиты ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date((s||todayStr())+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fmtDate=s=>{if(!s)return "без даты";const[y,m,d]=s.split("-");return (+d)+" "+MON[+m-1]+(y!=String(new Date().getFullYear())?" "+y:"")};
const uid8=()=>Math.random().toString(36).slice(2,10);
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=(m,cls="")=>m?.photo?`<img class="av ${cls}" src="${esc(String(m.photo).startsWith("data:image/")?m.photo:"/_blob/"+m.photo)}" alt="" loading="lazy">`:`<div class="av ${cls}" style="background:hsl(${hue(m?.id||m?.name)} 62% 48%)" aria-hidden="true">${esc(initials(m?.name))}</div>`;
/* компетенции: из анкеты (навыки + активность) или из ИИ-анализа */
const COMP=[
  {k:"lead",n:"Лидерство",from:{org:1,speak:1},led:true},
  {k:"net",n:"Нетворкинг",from:{partners:2,speak:1}},
  {k:"comm",n:"Коммуникация",from:{text:1,speak:1}},
  {k:"orgz",n:"Организованность",from:{org:2,budget:1}},
  {k:"crea",n:"Креативность",from:{creative:2,smm:1,media:1}},
  {k:"anal",n:"Аналитическое мышление",from:{analytics:2,tech:1}},
  {k:"ment",n:"Наставничество",from:{teach:2,tech:1}},
  {k:"media",n:"Медиа и контент",from:{smm:1,media:1,text:1}},
  {k:"team",n:"Командный дух",from:{sport:2,org:1}},
  {k:"money",n:"Финансовая грамотность",from:{budget:2,analytics:1}}
];
function compOf(mid,stats){
  const ai=S.chair[mid]?.analysis?.competencies;
  if(ai&&typeof ai==="object"){const out=COMP.map(c=>({k:c.k,n:c.n,v:clamp(+(ai[c.n]??ai[c.k])||0,0,5)})).filter(c=>c.v>0);if(out.length)return {src:"ai",list:out.sort((a,b)=>b.v-a.v)}}
  const sv=surveyOf(mid); if(!sv?.skills) return null;
  const st=stats||computeStats()[mid]||{};
  const list=COMP.map(c=>{let sum=0,w=0;for(const[k,wt]of Object.entries(c.from)){sum+=(+sv.skills[k]||1)*wt;w+=wt}
    let v=sum/w; if(c.led) v+=Math.min(1,(st.led||0)*0.5); if(c.k==="team") v+=Math.min(.5,(st.part||0)*.1);
    return {k:c.k,n:c.n,v:Math.round(clamp(v,1,5)*10)/10}}).sort((a,b)=>b.v-a.v);
  return {src:"survey",list};
}
const lvl=v=>`<span class="lvl" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${v>=i-.25?"on":""}"></i>`).join("")}</span>`;
function strengthChips(mid,n=3,stats){const c=compOf(mid,stats);if(!c)return "";return `<div class="str">${c.list.slice(0,n).map(x=>`<span class="chip" title="${esc(x.n)}: ${x.v} из 5">${esc(x.n)} ${lvl(x.v)}</span>`).join("")}</div>`}
const member=id=>S.members.find(m=>m.id===id);
const mname=id=>member(id)?.name||"—";
const dirChip=k=>DIRS[k]?`<span class="chip"><span class="dot" style="background:${DIRS[k].c}"></span>${DIRS[k].short}</span>`:"";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* очередь записей: по одной за раз на документ */
const Q={};
function write(path,fn){Q[path]=(Q[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast(e?.code==="quota_exceeded"?"Хранилище заполнено: удалите старые записи":"Не удалось сохранить. Проверьте доступ и попробуйте ещё раз")});return Q[path]}
function saveDoc(path,data){return write(path,()=>S.db.doc(path).set(data))}
function saveChair(mid,patch){const cur=S.chair[mid]||{};const next={...cur,...patch,updatedAt:Date.now()};S.chair[mid]=next;return saveDoc("chair/"+mid,next)}

/* ============ расчёты ============ */
function surveyOf(mid){
  const own=S.surveys.filter(s=>s.mid===mid).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
  if(own) return {...own,src:"self"};
  const c=S.chair[mid]?.survey; if(c) return {...c,src:"chair"};
  return null;
}
function computeStats(){
  const today=todayStr(),st={};
  S.members.forEach(m=>st[m.id]={led:0,ledActive:0,part:0,tasks:0,done:0,onTime:0,overdue:0,active:0,ideas:0,evs:[]});
  S.events.forEach(e=>{
    const inv=new Set(e.participants||[]); if(e.leadMid) inv.add(e.leadMid);
    (e.tasks||[]).forEach(t=>{ if(t.assignee) inv.add(t.assignee); const s=st[t.assignee]; if(!s)return; s.tasks++;
      if(t.done){s.done++; if(!t.due||(t.doneAt||"")<=t.due) s.onTime++;}
      else if(e.status!=="cancelled"&&e.status!=="done"){ s.active++; if(t.due&&t.due<today) s.overdue++; }
      else if(e.status==="done"){ s.overdue++; }
    });
    if(e.status==="cancelled"||e.status==="idea") return;
    inv.forEach(mid=>{const s=st[mid]; if(!s)return; s.part++; s.evs.push(e.id)});
    const L=st[e.leadMid]; if(L){L.led++; if(e.status!=="done") L.ledActive++;}
  });
  S.ideas.forEach(i=>{if(st[i.byMid]) st[i.byMid].ideas++});
  return st;
}
function loadOf(mid,s){const sv=surveyOf(mid);const hours=+sv?.hours||8;const used=s.active*3+s.ledActive*6;return {pct:Math.round(used/hours*100),hours,used}}
function loadTag(p){return p<40?{t:"Скучает",c:"good",col:"var(--good)"}:p<=100?{t:"В деле",c:"warn",col:"var(--warn)"}:{t:"Горит",c:"bad",col:"var(--bad)"}}
function critValues(mid,s){
  const sc=S.chair[mid]?.scores||{}; const sv=surveyOf(mid);
  const ch=k=>sc[k]?(sc[k]-1)/9*100:null;
  const mix=(a,b)=>a==null?b:b==null?a:(a+b)/2;
  const closed=s.done+s.overdue;
  const respAuto=closed>0?s.onTime/closed*100:null;
  const initAuto=Math.min(100,s.ideas*20+s.led*25);
  let capAuto=null; if(sv?.skills){const v=Object.values(sv.skills).map(Number).filter(x=>x>0).sort((a,b)=>b-a).slice(0,5); if(v.length) capAuto=(v.reduce((a,b)=>a+b,0)/v.length-1)/4*100;}
  const partAuto=Math.min(100,s.part*15+s.done*5);
  return {resp:mix(ch("resp"),respAuto),init:mix(ch("init"),initAuto),cap:mix(ch("cap"),capAuto),part:partAuto,res:ch("res"),
    auto:{resp:respAuto,init:initAuto,cap:capAuto,part:partAuto}};
}
function weights(){return S.weightsDraft||S.settings?.weights||DEFAULT_W}
function ratingAll(){return allRows().filter(r=>!r.m.isChair)}
function allRows(){
  const st=computeStats(),w=weights();
  const rows=S.members.map(m=>{const s=st[m.id],v=critValues(m.id,s);let sum=0,ws=0,have=0;
    CRIT.forEach(c=>{if(v[c.k]!=null){sum+=v[c.k]*(+w[c.k]||0);ws+=(+w[c.k]||0);have++}});
    return {m,s,v,total:ws?Math.round(sum/ws):0,have,load:loadOf(m.id,s)}});
  const sorted=rows.filter(r=>!r.m.isChair).sort((a,b)=>b.total-a.total); sorted.forEach((r,i)=>r.rank=i+1);
  return rows;
}

let pending=false;
function busyTyping(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="range"}

}

  const doneY=S.events.filter(e=>e.status==="done"&&(e.date||"").startsWith(y)).length;
  const avgLoad=rows.length?Math.round(rows.reduce((a,r)=>a+Math.min(r.load.pct,150),0)/rows.length):0;

  ${jokeBubble()}
  <div class="kpis">
    <div class="kpi"><div class="eyebrow">Участников</div><b>${rows.length}</b></div>
    <div class="kpi"><div class="eyebrow">Мероприятий в ${q+1} квартале</div><b>${evQ}</b></div>
    <div class="kpi"><div class="eyebrow">Проведено за ${y}</div><b>${doneY}</b>${doneY?`<span class="sfx">БАМ!</span>`:""}</div>
    <div class="kpi"><div class="eyebrow">Средняя загрузка</div><b>${avgLoad}%</b></div>
    <div class="kpi ${free.length?"hot":""}"><div class="eyebrow">Скучают без задач</div><b>${free.length}</b>${free.length?`<span class="sfx">ЭЙ!</span>`:""}</div>
  </div>
  <div class="grid g2">
    <section class="panel">
      <div class="panel-h"><h2>Кто сколько тащит</h2>${S.sample?`<button class="btn ai sm" data-act="teamPlan" ${S.teamBusy?"disabled":""}>Распределить нагрузку</button>`:""}</div>

      <div class="bars">${byDir.map(d=>`<div class="hb"><span>${DIRS[d.k].name}</span><div class="track"><i style="width:${d.done/maxDir*100}%;background:${DIRS[d.k].c}"></i><i style="width:${d.plan/maxDir*100}%;background:${DIRS[d.k].c};opacity:.35"></i></div><span class="num small">${d.done+d.plan}</span></div>`).join("")}</div>
    </section>

/* ============ ИИ ============ */
const AI_CTX="Ты помогаешь председателю Совета молодых специалистов крупной компании. Совет — сотрудники до 35 лет — организует обучение и наставничество (edu), спорт и тимбилдинг (sport), культуру и досуг (culture), социальные проекты и волонтёрство (social). Цель — больше мероприятий и равномерная вовлечённость каждого. Пиши по-русски, конкретно и доброжелательно, опирайся только на данные.";
function memberPayload(mid){
  const m=member(mid),s=computeStats()[mid],sv=surveyOf(mid),ch=S.chair[mid]||{};
  return {name:m.name,position:m.position,dept:m.dept,age:m.age,
    skills:sv?Object.fromEntries(Object.entries(sv.skills||{}).map(([k,v])=>[SK[k],v])):null,
    directions:sv?.directions,hoursPerMonth:sv?.hours,preferredRole:sv?.role,wantsToDevelop:sv?.grow,dislikes:sv?.avoid,ownIdea:sv?.idea,
    activity:{events:s.part,led:s.led,tasksDone:s.done,tasksTotal:s.tasks,onTime:s.onTime,overdue:s.overdue,ideasProposed:s.ideas},
    loadPercent:loadOf(mid,s).pct,chairScores1to10:ch.scores||{},chairNotes:ch.notes||""};
}
function aiErr(e){if(e?.code==="not_granted")toast("Доступ к ИИ не разрешён для этой страницы");else if(e?.code==="rate_limited")toast("Слишком много запросов к ИИ. Подождите минуту");else toast("ИИ задумался и ушёл пить чай. Попробуй ещё раз");console.error(e)}
async function aiAnalyze(){
  const mid=M.mid;M.aiBusy="an";renderMember();
  try{
    const r=await S.sample.json(`${AI_CTX}
Проанализируй участника совета. Данные:
${JSON.stringify(memberPayload(mid))}
Верни только JSON вида:
{"summary":"2–3 предложения о человеке как участнике совета","strengths":["3–5 сильных сторон"],"weaknesses":["2–4 зоны роста, тактично"],"roles":[{"role":"роль в мероприятиях","why":"почему"}],"develop":["2–3 способа развить зоны роста через задачи в совете"],"competencies":{${COMP.map(c=>`"${c.n}":1-5`).join(",")}}}
В competencies оцени каждую компетенцию целым числом от 1 до 5 по навыкам из анкеты, активности и оценкам председателя.`,{modelTier:"default"});
    await saveChair(mid,{analysis:{...r,at:Date.now()}});

  if(M&&M.mid===mid){M.aiBusy=null;renderMember()}

Верни только JSON:

В каждой идее 3–5 задач, days — через сколько дней от сегодня срок.`,{modelTier:"default"});

  if(M&&M.mid===mid){M.aiBusy=null;renderMember()}

async function aiTeam(){
  S.teamBusy=true;S.teamPlan=null;render();
  try{
    const rows=ratingAll();
    const people=rows.map(r=>{const sv=surveyOf(r.m.id);return {mid:r.m.id,name:r.m.name,position:r.m.position,
      topSkills:sv?Object.entries(sv.skills||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>SK[x[0]]):[],weak:sv?Object.entries(sv.skills||{}).filter(x=>x[1]<=2).map(x=>SK[x[0]]):[],

Текущие мероприятия: ${JSON.stringify(existing)}
Верни только JSON:
{"events":[{"title":"название","direction":"edu|sport|culture|social","why":"зачем и почему эта команда","leadMid":"mid","helperMids":["mid"],"tasks":[{"title":"задача","assigneeMid":"mid","days":14}]}]}
Используй только mid из списка участников.`,{modelTier:"default"});

document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]"); if(!el)return;
  const a=el.dataset.act;
  if(a==="bg"){if(ev.target===el)closeModal();return}
  if(el.tagName==="INPUT"&&el.type==="checkbox"&&a!=="tDone"&&a!=="myTask") return;
  const id=el.dataset.id;
  switch(a){
    case "tab": S.view=el.dataset.v; closeModal(); render(); scrollTo(0,0); break;
    case "mode": S.mode=el.dataset.v; S.view=S.mode==="chair"?"dash":"me"; closeModal(); render(); break;
    case "close": closeModal(); break;
    case "openMember": openMember(id); break;
    case "openChair": if(S.mode==="chair"&&S.isOwner) openMember(chairM().id); break;
    case "openEvent": openEvent(id); break;
    case "newEvent": openEvent(null); break;
    case "evf": S.evFilter=el.dataset.v; render(); break;
    case "evs": S.evStatus=el.dataset.v; render(); break;
    case "sort": {const k=el.dataset.k;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="name"?1:-1};render();break}
    case "resetW": S.weightsDraft={...DEFAULT_W}; saveWeights(); render(); break;

async function memeFile(file){
  if(!file)return;
  try{const img=await createImageBitmap(file);let w=Math.min(640,img.width),h=Math.round(img.height*w/img.width);
    if(h>900){h=900;w=Math.round(img.width*h/img.height)}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    let q=.78,url=c.toDataURL("image/jpeg",q);while(url.length>200000&&q>.35){q-=.1;url=c.toDataURL("image/jpeg",q)}
    if(url.length>240000){toast("Картинка слишком тяжёлая, возьми поменьше");return}
    S.memeDraft.img=url;render();
  }catch(e){console.error(e);toast("Не получилось открыть картинку. Попробуй JPG или PNG")}
}

async function squareJpeg(file){
  const img=await createImageBitmap(file);const side=Math.min(img.width,img.height),out=Math.min(480,side);
  const c=document.createElement("canvas");c.width=c.height=out;
  c.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,out,out);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));
}
async function uploadPhoto(mid,file){
  if(!file||!S.assets)return; const m=member(mid); if(!m)return;
  toast("Загружаю фото…");
  try{const blob=await squareJpeg(file);const r=await S.assets.upload(blob);
    await saveDoc("members/"+mid,{...stripId(m),photo:r.id});toast("Фото обновлено")}
  catch(e){console.error(e);toast("Не удалось загрузить фото. Попробуйте JPG или PNG до 10 МБ")}
}

}

/* ============ запуск ============ */
async function boot(){
  const C=window.claude;
  if(!C){S.ready=true;S.noDb=true;render();return}
  const [db,user,sample]=await Promise.all([C.use("db"),C.use("user"),C.use("sample")]);
  S.db=db;S.user=user;S.sample=sample;S.assets=await C.use("assets").catch(()=>null);
  S.isOwner=(await user?.isOwner())??false; S.uid=user?await user.id():null;
  S.mode=S.isOwner?"chair":"member"; S.view=S.isOwner?"dash":"me";
  if(!db){S.ready=true;S.noDb=true;render();return}
  const onErr=e=>{console.error(e)};
  const col=(name,key)=>db.collection(name).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));S.ready=true;render()},onErr);
  col("members","members"); col("events","events"); col("ideas","ideas"); col("memes","memes");
  if(S.isOwner){
    db.collection("chair").onSnapshot(s=>{const c={};s.docs.forEach(d=>{if(d.id==="settings")S.settings=d.data();else c[d.id]=d.data()});S.chair=c;render()},onErr);
    db.collection("surveys").onSnapshot(s=>{S.surveys=s.docs.map(d=>({uid:d.id,...d.data()}));if(S.uid){const me=S.surveys.find(x=>x.uid===S.uid);S.mySurvey=me||null;if(!S.meTouched)S.meDraft=null}render()},onErr);
  } else if(S.uid){
    db.doc("surveys/"+S.uid).onSnapshot(d=>{S.mySurvey=d.exists?d.data():null;if(!S.meTouched)S.meDraft=null;if(S.mySurvey)S.surveys=[{uid:S.uid,...S.mySurvey}];render()},onErr);
  }
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},4000);
}
renderTabs();
boot();
